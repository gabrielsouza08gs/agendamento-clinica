# Integração contínua: a cada push (ou pull request) o GitHub instala o projeto
# do zero e roda os testes automatizados. Se algum teste falhar, o envio fica
# marcado com ❌ na aba "Actions" do repositório.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar as dependências
        run: npm install

      - name: Rodar os testes
        run: npm test
